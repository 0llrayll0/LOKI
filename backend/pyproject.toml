[project]
name = "loki-backend"
version = "0.1.0"
description = "LOKI — Predictive Intelligence System (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "structlog>=24.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pyarrow>=17",
    "python-multipart>=0.0.33",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
